<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: no iPhone, o app ocupa a tela toda e as margens de área segura (entalhe/barra de gestos) passam a valer. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1117" />
    <!-- Tema do horário aplicado antes do primeiro desenho (sem piscar). -->
    <script src="/tema-inicial.js"></script>
    <!-- Instalado na tela inicial do iPhone ("Adicionar à Tela de Início"): abre como app, com a barra de status sobre o fundo. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NEXO" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>NEXO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
