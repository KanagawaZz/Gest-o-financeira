# Produção (Dokploy / Hostinger VPS):
# - PostgreSQL 16 (rede interna, volume persistente, sem porta pública)
# - Backend Django + Gunicorn (rede interna, migrações com advisory lock, healthcheck)
# - Web Frontend React + Caddy (porta interna 80 roteada pelo Traefik do Dokploy com HTTPS automático)
#
# Para uso standalone (sem Dokploy): descomente a seção "ports" do serviço "web" e defina CADDY_ADDRESS=${NEXO_DOMAIN}.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - nexo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sem "ports": o banco só é acessível pela rede interna do Compose.

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?defina DJANGO_SECRET_KEY}
      PLUGGY_ENCRYPTION_KEY: ${PLUGGY_ENCRYPTION_KEY:-}
      PLUGGY_AUTO_SYNC: ${PLUGGY_AUTO_SYNC:-true}
      DJANGO_ALLOWED_HOSTS: ${NEXO_DOMAIN:?defina NEXO_DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${NEXO_DOMAIN}
      DATABASE_URL: postgres://nexo:${POSTGRES_PASSWORD}@db:5432/nexo
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-True}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-kayronsilva.ofc@gmail.com}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-NEXO <kayronsilva.ofc@gmail.com>}
      FRONTEND_URL: https://${NEXO_DOMAIN}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    # Sem "ports": apenas o container "web" (Caddy) se comunica com o backend:8000.

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXO_DOMAIN: ${NEXO_DOMAIN:?defina NEXO_DOMAIN}
      CADDY_ADDRESS: ${CADDY_ADDRESS:-:80}
    expose:
      - "80"
    # No Dokploy, o Traefik já ocupa as portas 80 e 443 da VPS e encaminha o tráfego
    # para a porta 80 interna do serviço "web".
    # Se for rodar SEM Dokploy (standalone), descomente as linhas abaixo e defina CADDY_ADDRESS=${NEXO_DOMAIN}:
    # ports:
    #   - "80:80"
    #   - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - nexo_backups:/backups
    entrypoint: ["sh", "/backup.sh"]

volumes:
  nexo_pgdata:
  nexo_backups:
  caddy_data:
  caddy_config:
