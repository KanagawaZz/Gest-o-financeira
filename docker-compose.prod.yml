# Produção: PostgreSQL (sem porta exposta) + Django/gunicorn + Caddy (HTTPS + frontend).
# Uso: cp .env.prod.example .env.prod  &&  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - nexo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sem "ports": o banco só é acessível pela rede interna do Compose.

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?defina DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${NEXO_DOMAIN:?defina NEXO_DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${NEXO_DOMAIN}
      DATABASE_URL: postgres://nexo:${POSTGRES_PASSWORD}@db:5432/nexo
    # Sem "ports": só o Caddy fala com o backend.

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXO_DOMAIN: ${NEXO_DOMAIN:?defina NEXO_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  nexo_pgdata:
  caddy_data:
  caddy_config:
